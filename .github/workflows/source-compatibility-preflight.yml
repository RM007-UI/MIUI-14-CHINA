name: Verify pinned Joyeuse source candidates

on:
  workflow_dispatch:
  push:
    paths:
      - "manifests/joyeuse-a13-candidate.json"
      - "scripts/audit_candidate_sources.py"
      - ".github/workflows/source-compatibility-preflight.yml"

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify pinned commits and inspect source markers
        run: python scripts/audit_candidate_sources.py

      - name: Upload text-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joyeuse-source-preflight
          path: source-audit-report.txt
          if-no-files-found: warn
          retention-days: 14
