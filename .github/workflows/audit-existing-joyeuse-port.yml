name: Audit existing Joyeuse-only MIUI 14 China port

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-existing-joyeuse-port.yml"

permissions:
  contents: read

jobs:
  audit-port-archive:
    name: Download and inspect archive metadata only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download public archive for private-runner inspection
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown
          mkdir -p audit
          gdown 'https://drive.google.com/uc?id=1EiJzXG64lIQ4zy7OYlmtTvF8K4Ocrbkd' -O /tmp/joyeuse-miui14-cn.zip
          test -s /tmp/joyeuse-miui14-cn.zip
          printf 'Archive bytes: ' > audit/community-port-audit.txt
          stat -c '%s' /tmp/joyeuse-miui14-cn.zip >> audit/community-port-audit.txt
          printf 'SHA-256: ' >> audit/community-port-audit.txt
          sha256sum /tmp/joyeuse-miui14-cn.zip | awk '{print $1}' >> audit/community-port-audit.txt
          printf '\nZIP inventory (names and declared sizes only):\n' >> audit/community-port-audit.txt
          zipinfo -l /tmp/joyeuse-miui14-cn.zip >> audit/community-port-audit.txt
          printf '\nInstaller and device-assert references (if present):\n' >> audit/community-port-audit.txt
          python - <<'PY' >> audit/community-port-audit.txt
          import zipfile
          p = "/tmp/joyeuse-miui14-cn.zip"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              print("ZIP entries:", len(names))
              for n in names:
                  low = n.lower()
                  if any(k in low for k in ("updater-script", "update-binary", "metadata", "payload", "android-info", "dynamic_partitions")):
                      info = z.getinfo(n)
                      print(f"{n}\t{info.file_size} bytes")
              for n in ("META-INF/com/android/metadata", "META-INF/com/android/metadata.pb", "META-INF/com/android/otacert"):
                  if n in names and not n.endswith(".pb") and not n.endswith("otacert"):
                      print("--- " + n + " contents ---")
                      print(z.read(n).decode("utf-8", "replace"))
              scripts = [n for n in names if n.lower().endswith("updater-script")]
              for n in scripts[:3]:
                  print(f"--- {n} ---")
                  try:
                      s = z.read(n).decode("utf-8", "replace")
                      for line in s.splitlines():
                          if any(k in line.lower() for k in ("assert", "joyeuse", "miatoll", "block_image", "package_extract_file", "write_raw_image", "format(", "delete_recursive")):
                              print(line[:500])
                  except Exception as e:
                      print("Could not read script:", type(e).__name__)
          PY
          echo "Boot image header inspection:" >> audit/community-port-audit.txt
          python - <<'PY' >> audit/community-port-audit.txt
          import zipfile, struct, hashlib, os
          p = "/tmp/joyeuse-miui14-cn.zip"
          out = "/tmp/joyeuse-boot.img"
          with zipfile.ZipFile(p) as z:
              info = z.getinfo("images/boot.img")
              with z.open(info) as src, open(out, "wb") as dst:
                  while True:
                      chunk = src.read(1024 * 1024)
                      if not chunk: break
                      dst.write(chunk)
          with open(out, "rb") as f:
              head = f.read(4096)
          print("Extracted boot.img bytes:", os.path.getsize(out))
          print("boot.img SHA-256:", hashlib.sha256(open(out, "rb").read()).hexdigest())
          print("Boot magic:", repr(head[:8]))
          if head[:8] == b"ANDROID!":
              vals = struct.unpack_from("<10I", head, 8)
              print("Legacy boot header fields (kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size, header_version, os_version):", vals)
              print("Header version field:", vals[8])
          else:
              print("Not a legacy ANDROID! header; needs format-specific parser.")
          # Report only a small selection of printable kernel/build markers.
          data = open(out, "rb").read()
          import re
          strings = [x.decode("ascii", "replace") for x in re.findall(rb"[ -~]{8,}", data)]
          hits = [s for s in strings if any(k in s.lower() for k in ("linux version", "androidboot.", "joyeuse", "miatoll", "clang version"))]
          print("Selected printable markers:")
          for s in hits[:35]: print(s[:240])
          PY
          rm -f /tmp/joyeuse-boot.img
          echo "Super image geometry and logical-partition metadata:" >> audit/community-port-audit.txt
          python - <<'PY' >> audit/community-port-audit.txt
          import zipfile, struct, hashlib
          p = "/tmp/joyeuse-miui14-cn.zip"
          GEOM_MAGIC = 0x616c4467
          HEADER_MAGIC = 0x414c5030
          def cstr(b):
              return b.split(b"\\0", 1)[0].decode("ascii", "replace")
          with zipfile.ZipFile(p) as z:
              info = z.getinfo("super.img")
              print("super.img declared bytes:", info.file_size)
              with z.open(info) as src:
                  # Geometry copies and metadata slots are at the beginning of a raw LP super image.
                  head = src.read(256 * 1024)
          print("First 4 bytes:", head[:4].hex(), repr(head[:4]))
          if head[:4] == bytes.fromhex("3aff26ed"):
              print("Image format: Android sparse; this parser expects raw super.img and will not guess-convert it.")
          else:
              print("Image format: raw/non-sparse based on initial magic")
          geom = None
          for off in (4096, 8192):
              if off + 52 > len(head): continue
              magic, struct_size = struct.unpack_from("<II", head, off)
              if magic != GEOM_MAGIC: continue
              raw = bytearray(head[off:off+struct_size])
              expected = bytes(raw[8:40])
              raw[8:40] = bytes(32)
              valid = hashlib.sha256(raw).digest() == expected
              meta_max, slots, block_size = struct.unpack_from("<III", head, off+40)
              print(f"Geometry at {off}: struct_size={struct_size}, checksum_valid={valid}, metadata_max_size={meta_max}, metadata_slots={slots}, logical_block_size={block_size}")
              if valid and struct_size == 52:
                  geom = (meta_max, slots, block_size)
          if not geom:
              print("ERROR: no checksum-valid liblp geometry found; logical partition table was not parsed.")
          else:
              meta_max, slots, block_size = geom
              # Each metadata slot follows the two 4 KiB geometry blocks.
              metadata_base = 3 * 4096
              for slot in range(min(slots, 4)):
                  off = metadata_base + slot * meta_max
                  if off + 128 > len(head):
                      print(f"Slot {slot}: metadata header outside inspected range")
                      continue
                  magic, major, minor, header_size = struct.unpack_from("<IHHI", head, off)
                  if magic != HEADER_MAGIC:
                      print(f"Slot {slot} at {off}: no LP metadata header (magic={magic:#x})")
                      continue
                  if header_size < 128 or header_size > 4096 or off + header_size > len(head):
                      print(f"Slot {slot}: implausible header_size={header_size}")
                      continue
                  header = bytearray(head[off:off+header_size])
                  expected_header = bytes(header[12:44])
                  header[12:44] = bytes(32)
                  header_ok = hashlib.sha256(header).digest() == expected_header
                  tables_size = struct.unpack_from("<I", head, off+44)[0]
                  expected_tables = bytes(head[off+48:off+80])
                  tables_start = off + header_size
                  tables = head[tables_start:tables_start+tables_size]
                  tables_ok = len(tables) == tables_size and hashlib.sha256(tables).digest() == expected_tables
                  print(f"Slot {slot}: LP metadata v{major}.{minor}, header_size={header_size}, tables_size={tables_size}, header_checksum_valid={header_ok}, tables_checksum_valid={tables_ok}")
                  if not (header_ok and tables_ok):
                      continue
                  descs = [struct.unpack_from("<III", head, off+pos) for pos in (80,92,104,116)]
                  names = ("partitions","extents","groups","block_devices")
                  tables_data = {}
                  for name, (rel, count, entsize) in zip(names, descs):
                      a = rel
                      b = rel + count * entsize
                      if b > len(tables) or entsize == 0:
                          print(f"  {name}: invalid table bounds rel={rel} count={count} entry_size={entsize}")
                          tables_data[name] = []
                          continue
                      entries = []
                      for i in range(count):
                          e = tables[a+i*entsize:a+(i+1)*entsize]
                          entries.append(e)
                      tables_data[name] = entries
                      print(f"  {name}: count={count}, entry_size={entsize}")
                  groups = []
                  for e in tables_data["groups"]:
                      if len(e) >= 48:
                          name = cstr(e[:36]); flags = struct.unpack_from("<I",e,36)[0]; maxsize = struct.unpack_from("<Q",e,40)[0]
                          groups.append(name)
                          print(f"    group: {name}, max_size={maxsize}, flags={flags}")
                  devices = []
                  for e in tables_data["block_devices"]:
                      if len(e) >= 64:
                          first, align, alignoff, size = struct.unpack_from("<QIIQ",e,0)
                          name = cstr(e[24:60]); flags = struct.unpack_from("<I",e,60)[0]
                          devices.append((name,size))
                          print(f"    block_device: {name}, declared_size={size}, first_logical_sector={first}, alignment={align}, flags={flags}")
                  extents = []
                  for e in tables_data["extents"]:
                      if len(e) >= 24:
                          sectors, target_type, target_data, target_source = struct.unpack_from("<QIQI",e,0)
                          extents.append((sectors,target_type,target_data,target_source))
                  system_extents = []
                  for e in tables_data["partitions"]:
                      if len(e) >= 52:
                          name = cstr(e[:36]); attrs, first, count, group_idx = struct.unpack_from("<IIII",e,36)
                          part_extents = extents[first:min(first+count,len(extents))]
                          size_sectors = sum(x[0] for x in part_extents)
                          print(f"    partition: {name}, size_bytes={size_sectors*512}, extents={count}, group_index={group_idx}, attributes={attrs}")
                          if name == "system":
                              system_extents = part_extents
                  if system_extents:
                      out = "/tmp/joyeuse-system.img"
                      print("Extracting logical system partition temporarily for property inspection; it will not be uploaded.")
                      with zipfile.ZipFile(p) as z, z.open("super.img") as src, open(out,"wb") as dst:
                          for sectors, target_type, target_data, target_source in system_extents:
                              if target_type == 0 and target_source == 0:
                                  physical_offset = target_data * 512
                                  byte_count = sectors * 512
                                  print(f"  system extent: physical_offset={physical_offset}, bytes={byte_count}, target=linear")
                                  src.seek(physical_offset)
                                  remaining = byte_count
                                  while remaining:
                                      chunk = src.read(min(1024*1024, remaining))
                                      if not chunk: raise RuntimeError("Unexpected end while extracting system extent")
                                      dst.write(chunk)
                                      remaining -= len(chunk)
                              elif target_type == 1:
                                  remaining = sectors * 512
                                  zero = bytes(1024*1024)
                                  while remaining:
                                      chunk = min(len(zero), remaining)
                                      dst.write(zero[:chunk])
                                      remaining -= chunk
                              else:
                                  raise RuntimeError(f"Unsupported system extent mapping type={target_type}, source={target_source}")
                      import os, shutil, subprocess
                      print("Temporary system image bytes:", os.path.getsize(out))
                      if shutil.which("file"):
                          desc = subprocess.run(["file", out], capture_output=True, text=True).stdout.strip()
                          print("system filesystem type:", desc)
                      if shutil.which("debugfs"):
                          for path in ("/build.prop", "/system/build.prop", "/etc/build.prop"):
                              proc = subprocess.run(["debugfs", "-R", f"cat {path}", out], capture_output=True, text=True)
                              hits = [line for line in proc.stdout.splitlines() if any(k in line for k in ("ro.build.version.release=", "ro.build.version.sdk=", "ro.build.version.incremental=", "ro.build.fingerprint=", "ro.build.version.security_patch=", "ro.miui.ui.version.name=", "ro.miui.ui.version.code=", "ro.product.mod_device=", "ro.product.device="))]
                              if hits:
                                  print(f"Build properties found in {path}:")
                                  for line in hits[:40]: print("  " + line[:260])
                                  break
                          else:
                              print("No expected build properties found through ext4 debugfs; filesystem may be non-ext4 or properties may be stored elsewhere.")
                      else:
                          print("debugfs unavailable on runner; system filesystem properties were not decoded.")
                      os.remove(out)
                      print("Temporary system image removed.")
                  # A checksum-valid copy is enough to report a table; avoid duplicate noisy output.
                  break
          PY
          echo "Audit completed. ROM and extracted boot image are not published or uploaded as artifacts."
          rm -f /tmp/joyeuse-miui14-cn.zip

      - name: Upload text audit only
        uses: actions/upload-artifact@v4
        with:
          name: joyeuse-community-port-audit
          path: audit/community-port-audit.txt
          if-no-files-found: error
          retention-days: 14
