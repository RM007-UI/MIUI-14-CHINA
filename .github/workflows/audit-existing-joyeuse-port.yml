name: Audit existing Joyeuse-only MIUI 14 China port

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-existing-joyeuse-port.yml"

permissions:
  contents: read

jobs:
  audit-port-archive:
    name: Download and inspect archive metadata only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download public archive for private-runner inspection
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown
          mkdir -p audit
          gdown 'https://drive.google.com/uc?id=1EiJzXG64lIQ4zy7OYlmtTvF8K4Ocrbkd' -O /tmp/joyeuse-miui14-cn.zip
          test -s /tmp/joyeuse-miui14-cn.zip
          printf 'Archive bytes: ' > audit/community-port-audit.txt
          stat -c '%s' /tmp/joyeuse-miui14-cn.zip >> audit/community-port-audit.txt
          printf 'SHA-256: ' >> audit/community-port-audit.txt
          sha256sum /tmp/joyeuse-miui14-cn.zip | awk '{print $1}' >> audit/community-port-audit.txt
          printf '\nZIP inventory (names and declared sizes only):\n' >> audit/community-port-audit.txt
          zipinfo -l /tmp/joyeuse-miui14-cn.zip >> audit/community-port-audit.txt
          printf '\nInstaller and device-assert references (if present):\n' >> audit/community-port-audit.txt
          python - <<'PY' >> audit/community-port-audit.txt
          import zipfile
          p = "/tmp/joyeuse-miui14-cn.zip"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              print("ZIP entries:", len(names))
              for n in names:
                  low = n.lower()
                  if any(k in low for k in ("updater-script", "update-binary", "metadata", "payload", "android-info", "dynamic_partitions")):
                      info = z.getinfo(n)
                      print(f"{n}\t{info.file_size} bytes")
              for n in ("META-INF/com/android/metadata", "META-INF/com/android/metadata.pb", "META-INF/com/android/otacert"):
                  if n in names and not n.endswith(".pb") and not n.endswith("otacert"):
                      print("--- " + n + " contents ---")
                      print(z.read(n).decode("utf-8", "replace"))
              scripts = [n for n in names if n.lower().endswith("updater-script")]
              for n in scripts[:3]:
                  print(f"--- {n} ---")
                  try:
                      s = z.read(n).decode("utf-8", "replace")
                      for line in s.splitlines():
                          if any(k in line.lower() for k in ("assert", "joyeuse", "miatoll", "block_image", "package_extract_file", "write_raw_image", "format(", "delete_recursive")):
                              print(line[:500])
                  except Exception as e:
                      print("Could not read script:", type(e).__name__)
          PY
          echo "Boot image header inspection:" >> audit/community-port-audit.txt
          python - <<'PY' >> audit/community-port-audit.txt
          import zipfile, struct, hashlib, os
          p = "/tmp/joyeuse-miui14-cn.zip"
          out = "/tmp/joyeuse-boot.img"
          with zipfile.ZipFile(p) as z:
              info = z.getinfo("images/boot.img")
              with z.open(info) as src, open(out, "wb") as dst:
                  while True:
                      chunk = src.read(1024 * 1024)
                      if not chunk: break
                      dst.write(chunk)
          with open(out, "rb") as f:
              head = f.read(4096)
          print("Extracted boot.img bytes:", os.path.getsize(out))
          print("boot.img SHA-256:", hashlib.sha256(open(out, "rb").read()).hexdigest())
          print("Boot magic:", repr(head[:8]))
          if head[:8] == b"ANDROID!":
              vals = struct.unpack_from("<10I", head, 8)
              print("Legacy boot header fields (kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size, header_version, os_version):", vals)
              print("Header version field:", vals[8])
          else:
              print("Not a legacy ANDROID! header; needs format-specific parser.")
          # Report only a small selection of printable kernel/build markers.
          data = open(out, "rb").read()
          import re
          strings = [x.decode("ascii", "replace") for x in re.findall(rb"[ -~]{8,}", data)]
          hits = [s for s in strings if any(k in s.lower() for k in ("linux version", "androidboot.", "joyeuse", "miatoll", "clang version"))]
          print("Selected printable markers:")
          for s in hits[:35]: print(s[:240])
          PY
          rm -f /tmp/joyeuse-boot.img
          echo "Audit completed. ROM and extracted boot image are not published or uploaded as artifacts."
          rm -f /tmp/joyeuse-miui14-cn.zip

      - name: Upload text audit only
        uses: actions/upload-artifact@v4
        with:
          name: joyeuse-community-port-audit
          path: audit/community-port-audit.txt
          if-no-files-found: error
          retention-days: 14
