name: Safe repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-check:
    name: Validate project metadata only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project scope and safety notes
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          grep -Fq 'MIUI 14 China' README.md
          grep -Fq 'joyeuse' README.md
          grep -Fq 'cupid' README.md
          grep -Fq 'Android 13' README.md
          grep -Fq 'V14.0.10.0.TLCCNXM' README.md
          grep -Fq 'No ROM image has been built' README.md
          grep -Fq 'does not prove a ROM builds' README.md
          test -f research/CUPID_PAYLOAD_AUDIT.md
          test -f research/PORT_STRATEGY.md
          test -f .github/workflows/inspect-joyeuse-base.yml
          echo "Metadata checks passed. This workflow does not build or package a ROM."

# Safety boundary:
# This workflow intentionally does not flash devices or write device partitions.
